name: V13 Font Docker Validation

on:
  push:
    branches:
      - v13-fonts-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull -t student-assistant:v13-fonts .

      - name: Verify multilingual fonts
        run: |
          docker run --rm --entrypoint sh student-assistant:v13-fonts -c '
            set -eu
            for script in Tamil Arabic Sinhala; do
              fc-list : family | grep -Eiq "Noto.*${script}" || {
                echo "Missing Noto ${script}"
                exit 1
              }
            done
          '

      - name: Test V13 runtime fonts in Python 3.12
        run: |
          docker run --rm --entrypoint python student-assistant:v13-fonts \
            -m unittest -q TEST_V130_FONT_LIBRARY

          docker run --rm --entrypoint python student-assistant:v13-fonts \
            -c 'from office_language_check_v130 import classify; from office_legacy_fonts_v130 import recognized_legacy_font; from pdf_fontstudio_v130 import FONT_STUDIO_BUTTON; assert [classify(chr(c)) for c in (0x0b85, 0x0041, 0x0627, 0x0d85)] == ["ta", "en", "ar", "si"]; assert recognized_legacy_font("Kalaham"); assert "Font & Writing Studio" in FONT_STUDIO_BUTTON; print("Multilingual runtime smoke check passed")'
